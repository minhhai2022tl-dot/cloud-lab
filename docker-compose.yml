
services:
  backend:
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    image: mern-backend
    network_mode: host
    env_file:
      - ./mern-demo/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile
    image: mern-frontend
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - mern-network
    restart: unless-stopped

networks:
  mern-network:
    driver: bridge
